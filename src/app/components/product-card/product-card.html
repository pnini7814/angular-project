<div class="mb-4 p-8 flex items-center justify-center">
    <p-card [style]="{ width: '25rem', overflow: 'hidden' }">
        <ng-template #header>
            <div class="relative" style="height: 200px; overflow: hidden;">
                <img
                    alt="{{product.name}}"
                    [src]="product.imageUrl"
                    style="width: 100%; height: 100%; object-fit: cover;"
                />
            </div>
        </ng-template>

        <ng-template #title>
            <div class="flex justify-content-between align-items-center">
                <span>{{product.name}}</span>
                <span class="text-xl font-bold text-primary">${{product.price}}</span>
            </div>
        </ng-template>

        <ng-template #subtitle>
            <div class="flex flex-column gap-3 mt-2">
                <div class="flex gap-2">
                    <p-tag [value]="product.categoryName" severity="secondary"></p-tag>
                    
                    <p-tag 
                        [value]="product.isAvailable ? 'In Stock' : 'Out of Stock'" 
                        [severity]="product.isAvailable ? 'success' : 'danger'">
                    </p-tag>
                </div>
            </div>
        </ng-template>

        <ng-template #footer>
            <div class="flex gap-4 mt-1">
                <p-button 
                    label="View Details" 
                    severity="secondary" 
                    class="w-full" 
                    [outlined]="true" 
                    styleClass="w-full" 
                    (onClick)="viewProduct.emit(product)" />
                
                <p-button 
                    label="Add to Cart" 
                    class="w-full" 
                    styleClass="w-full" 
                    [disabled]="!product.isAvailable"
                    (onClick)="addToCart.emit(product)" />
            </div>
        </ng-template>
    </p-card>
</div>
