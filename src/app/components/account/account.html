<div class="card p-6 min-h-screen surface-ground">
    <div class="max-w-4xl mx-auto">
        
        <div class="flex justify-content-between align-items-center mb-5">
            
            
            @if (authService.isLoggedIn()) {
                <p-button label="Logout" icon="pi pi-sign-out" severity="danger" [outlined]="true" (onClick)="logout()"></p-button>
            }
        </div>

        @if (!authService.isLoggedIn()) {
            <div class="surface-card p-4 shadow-2 border-round">
                <div class="flex justify-content-center mb-5">
                    <p-selectButton 
                        [options]="[{label: 'Login', value: 'login'}, {label: 'Register', value: 'register'}]" 
                        [(ngModel)]="activeTab">
                    </p-selectButton>
                </div>

                <div class="mt-4">
                    @switch (activeTab) {
                        @case ('login') {
                            <app-login></app-login>
                        }
                        @case ('register') {
                            <app-register></app-register>
                        }
                        @default {
                            <app-login></app-login>
                        }
                    }
                </div>
            </div>
        } @else {
            <div class="card">
                <h2 class="text-2xl font-bold mb-4">Welcome, {{ authService.userFullName() }}!</h2>
                <p-tabs value="0">
                    <p-tablist>
                        <p-tab value="0">
                            <i class="pi pi-history mr-2"></i> Order History
                        </p-tab>
                        <p-tab value="1">
                            <i class="pi pi-user-edit mr-2"></i> Update Details
                        </p-tab>
                    </p-tablist>
                    
                    <p-tabpanels>
                        <p-tabpanel value="0">
                            <app-orders-history></app-orders-history>
                        </p-tabpanel>
                        
                        <p-tabpanel value="1">
                            <app-update-details></app-update-details>
                        </p-tabpanel>
                    </p-tabpanels>
                </p-tabs>
            </div>
        }

    </div>
</div>
