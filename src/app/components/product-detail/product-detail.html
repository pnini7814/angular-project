<div class="mb-4">
    <p-breadcrumb *ngIf="product; else breadcrumbSkeleton" [model]="items" [home]="home"></p-breadcrumb>
    <ng-template #breadcrumbSkeleton>
        <p-skeleton width="15rem" height="1.5rem"></p-skeleton>
    </ng-template>
</div>

<div class="card p-6" *ngIf="product; else productSkeleton">
    <div class="grid flex-row-reverse">
        
        <div class="col-12 md:col-4 flex justify-content-center align-items-start p-3">
            <div class="surface-50 border-round p-3 shadow-1 w-full flex justify-content-center">
                <img [src]="product.imageUrl" [alt]="product.name" 
                     class="border-round" 
                     style="width: 100%; max-width: 250px; height: auto; object-fit: contain;">
            </div>
        </div>

        <div class="col-12 md:col-8 px-0 md:px-6 mt-4 md:mt-0 text-left">
            <div class="flex justify-content-between align-items-center mb-3">
                <h1 class="text-900 font-bold text-4xl m-0">{{ product.name }}</h1>
                <p-tag 
                    [value]="product.isAvailable ? 'In Stock' : 'Out of Stock'" 
                    [severity]="product.isAvailable ? 'success' : 'danger'">
                </p-tag>
            </div>
            
            <div class="mb-4">
                <p-tag [value]="product.categoryName" severity="info" [rounded]="true"></p-tag>
            </div>

            <div class="text-3xl font-semibold text-primary mb-4">
                {{ product.price | currency }}
            </div>

            <p class="line-height-3 text-700 mb-5 border-bottom-1 surface-border pb-5">
                {{ product.description }}
            </p>

            <div class="flex flex-column gap-3" *ngIf="product.isAvailable">
                <label for="quantity" class="font-bold text-900">Quantity:</label>
                <div class="flex align-items-center gap-3">
                    <p-inputNumber [(ngModel)]="quantity" [showButtons]="true" buttonLayout="horizontal" 
                        spinnerMode="horizontal" class="w-10rem"
                        decrementButtonClass="p-button-secondary" incrementButtonClass="p-button-secondary" 
                        incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus">
                    </p-inputNumber>

                    <p-button label="Add to Cart" icon="pi pi-shopping-cart" class="flex-grow-1" 
                        styleClass="w-full" (onClick)="addToCart()">
                    </p-button>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #productSkeleton>
    <div class="card p-6">
        <div class="grid flex-row-reverse">
            <div class="col-12 md:col-4 p-3">
                <p-skeleton width="100%" height="250px" borderRadius="10px"></p-skeleton>
            </div>
            <div class="col-12 md:col-8 px-0 md:px-6 mt-4 md:mt-0">
                <div class="flex justify-content-between mb-3">
                    <p-skeleton width="50%" height="3rem"></p-skeleton>
                    <p-skeleton width="15%" height="2rem"></p-skeleton>
                </div>
                <p-skeleton width="20%" height="1.5rem" styleClass="mb-4"></p-skeleton>
                <p-skeleton width="10%" height="2.5rem" styleClass="mb-4"></p-skeleton>
                <p-skeleton width="100%" height="120px" styleClass="mb-5"></p-skeleton>
                <div class="flex gap-3">
                    <p-skeleton width="10rem" height="3rem"></p-skeleton>
                    <p-skeleton width="100%" height="3rem"></p-skeleton>
                </div>
            </div>
        </div>
    </div>
</ng-template>
