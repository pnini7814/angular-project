<p-toast></p-toast>

<div class="p-4">
  <h2 class="text-2xl font-bold mb-4">Order History</h2>

  <div *ngIf="orders().length > 0; else noOrders">
    <p-dataView [value]="orders()" layout="list">
      <ng-template #list let-orders>
        <div class="grid grid-nogutter">
          <div class="col-12" *ngFor="let order of orders; let first = first">
            <div class="flex flex-column md:flex-row md:align-items-center p-4 gap-4" [ngClass]="{ 'border-t border-surface-200 dark:border-surface-700': !first }">
              <div class="flex-1">
                <div class="flex align-items-center gap-3 mb-2">
                  <span class="font-medium text-lg">Order #{{ order.id }}</span>
                  <p-tag [value]="order.status" [severity]="getSeverity(order.status)"></p-tag>
                </div>
                <div class="text-sm text-600 mb-2">Date: {{ order.orderDate | date:'medium' }}</div>
                <div class="text-sm text-600 mb-3">Items: {{ order.orderItems.length }}</div>
                <div class="text-lg font-semibold">Total: ${{ order.orderSum }}</div>
              </div>

              <div class="flex flex-column gap-2">
                <p-button
                  *ngIf="order.status === 'created'"
                  label="Mark as Collected"
                  icon="pi pi-check"
                  severity="warn"
                  size="small"
                  (onClick)="updateStatus(order, 'collected')">
                </p-button>
                <p-button
                  *ngIf="order.status === 'collected'"
                  label="Mark as Shipped"
                  icon="pi pi-send"
                  severity="success"
                  size="small"
                  (onClick)="updateStatus(order, 'shipped')">
                </p-button>
                <p-button
                  *ngIf="order.status === 'shipped'"
                  label="Mark as Delivered"
                  icon="pi pi-check-circle"
                  severity="success"
                  size="small"
                  (onClick)="updateStatus(order, 'delivered')">
                </p-button>
              </div>
            </div>
          </div>
        </div>
      </ng-template>
    </p-dataView>
  </div>

  <ng-template #noOrders>
    <div class="text-center p-5 surface-50 border-round">
      <i class="pi pi-shopping-bag text-5xl mb-3 text-400"></i>
      <p class="text-xl">No orders found.</p>
      <p class="text-600">Your order history will appear here once you place orders.</p>
    </div>
  </ng-template>
</div>
