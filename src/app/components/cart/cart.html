<p-toast></p-toast>

<div class="p-4 max-w-5xl mx-auto">
      <p-card header="Shopping Cart Summary">
        <div *ngIf="cartService.order().orderItems.length > 0; else empty">
          @for (item of cartService.order().orderItems; track item.productId) {
            <app-cart-item 
              [item]="item"
              (increment)="cartService.updateQuantity(item.productId, 1)"
              (decrement)="cartService.updateQuantity(item.productId, -1)"
              (remove)="cartService.removeItem(item.productId)">
            </app-cart-item>
          }

          <div class="flex flex-column align-items-end mt-4 gap-2">
            <div class="text-600">Status: {{ cartService.order().status | uppercase }}</div>
            <div class="text-2xl mt-2">
              Order Total: <span class="font-bold text-primary">{{ cartService.totalSum() | currency }}</span>
            </div>
            <p-button label="Checkout Now" icon="pi pi-shopping-bag" severity="success" class="mt-3 w-full md:w-auto" (onClick)="checkout()"></p-button>
          </div>
        </div>

        <ng-template #empty>
          <div class="text-center p-5 surface-50 border-round">
            <i class="pi pi-shopping-cart text-5xl mb-3 text-400"></i>
            <p class="text-xl">Your cart is currently empty.</p>
            <p-button label="Continue Shopping" [link]="true" (click)="router.navigate(['/products'])"></p-button>
          </div>
        </ng-template>
      </p-card>
    </div>
